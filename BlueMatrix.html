<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATRIX — Personal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #0af;
      --cyan-dim: rgba(0, 170, 255, 0.35);
      --cyan-glow: rgba(0, 170, 255, 0.55);
      --ink: #04080f;
      --text: #d8f0ff;
      --muted: rgba(180, 220, 245, 0.72);
      --ring-size: min(56vmin, 400px);
      --ease-dock: cubic-bezier(0.22, 1, 0.36, 1);
      --dock-duration: 0.85s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
    }

    #rain-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      background: #000;
    }

    /* 子界面内容层 */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 3.5rem);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.55s ease,
        visibility 0.55s ease,
        padding 0.85s var(--ease-dock);
    }

    .stage.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* 为角落圆环预留空间 */
    .stage.dock-bl {
      padding-left: calc(var(--ring-size) * 0.42);
      padding-bottom: calc(var(--ring-size) * 0.42);
    }

    .stage.dock-tl {
      padding-left: calc(var(--ring-size) * 0.42);
      padding-top: calc(var(--ring-size) * 0.42);
    }

    .stage.dock-tr {
      padding-right: calc(var(--ring-size) * 0.42);
      padding-top: calc(var(--ring-size) * 0.42);
    }

    .stage.dock-br {
      padding-right: calc(var(--ring-size) * 0.42);
      padding-bottom: calc(var(--ring-size) * 0.42);
    }

    .stage-card {
      width: min(640px, 100%);
      max-height: min(70vh, 560px);
      overflow: auto;
      padding: clamp(1.25rem, 3vw, 2.25rem);
      border: 1px solid rgba(0, 170, 255, 0.28);
      background:
        linear-gradient(135deg, rgba(0, 40, 70, 0.45), rgba(0, 10, 20, 0.55)),
        rgba(2, 10, 18, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px rgba(0, 170, 255, 0.08) inset,
        0 20px 60px rgba(0, 0, 0, 0.35);
      transform: translateY(28px) scale(0.96);
      opacity: 0;
      filter: blur(8px);
      transition:
        transform 0.7s var(--ease-dock) 0.12s,
        opacity 0.65s ease 0.12s,
        filter 0.65s ease 0.12s;
    }

    .stage.is-open .stage-card {
      transform: translateY(0) scale(1);
      opacity: 1;
      filter: blur(0);
    }

    .stage-kicker {
      margin: 0 0 0.4rem;
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .stage-title {
      margin: 0 0 1.1rem;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      letter-spacing: 0.14em;
      font-weight: 700;
      text-shadow: 0 0 24px var(--cyan-glow);
    }

    .stage-title::after {
      content: "";
      display: block;
      width: 0;
      height: 1px;
      margin-top: 0.85rem;
      background: linear-gradient(90deg, var(--cyan), transparent);
      transition: width 0.8s var(--ease-dock) 0.35s;
    }

    .stage.is-open .stage-title::after {
      width: min(220px, 55%);
    }

    .stage-body {
      font-size: 1.12rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .stage-body p {
      margin: 0 0 1rem;
      opacity: 0;
      transform: translateY(12px);
    }

    .stage.is-open .stage-body p {
      animation: line-in 0.55s ease forwards;
    }

    .stage.is-open .stage-body p:nth-child(1) {
      animation-delay: 0.35s;
    }

    .stage.is-open .stage-body p:nth-child(2) {
      animation-delay: 0.48s;
    }

    .stage.is-open .stage-body p:nth-child(3) {
      animation-delay: 0.6s;
    }

    @keyframes line-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 圆环枢纽：固定定位以便平移到四角 */
    .hub-inner {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 4;
      width: var(--ring-size);
      height: var(--ring-size);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition:
        left var(--dock-duration) var(--ease-dock),
        top var(--dock-duration) var(--ease-dock),
        transform var(--dock-duration) var(--ease-dock);
      animation: hub-enter 1s ease-out forwards;
    }

    @keyframes hub-enter {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .hub-inner.is-ready {
      opacity: 1;
      animation: none;
    }

    /* 圆心落到角落 → 只露出对角四分之一 */
    .hub-inner.dock-bl {
      left: 0;
      top: 100%;
      transform: translate(-50%, -50%) scale(0.92);
    }

    .hub-inner.dock-tl {
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) scale(0.92);
    }

    .hub-inner.dock-tr {
      left: 100%;
      top: 0;
      transform: translate(-50%, -50%) scale(0.92);
    }

    .hub-inner.dock-br {
      left: 100%;
      top: 100%;
      transform: translate(-50%, -50%) scale(0.92);
    }

    .hub-inner::before {
      content: "";
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 170, 255, 0.18) 0%,
        rgba(0, 170, 255, 0.06) 42%,
        transparent 70%
      );
      animation: aura-breathe 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.5s ease;
    }

    .hub-inner.is-docked::before {
      opacity: 0.45;
    }

    @keyframes aura-breathe {
      0%,
      100% {
        opacity: 0.65;
        transform: scale(0.98);
      }
      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    .brand {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      text-align: center;
      z-index: 2;
      transition: opacity 0.35s ease, transform 0.45s ease;
    }

    .hub-inner.is-docked .brand {
      opacity: 0;
      transform: scale(0.8);
    }

    .brand-name {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 4.5vmin, 2.4rem);
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #e8f7ff;
      text-shadow: 0 0 24px var(--cyan-glow);
      animation: brand-pulse 4s ease-in-out infinite;
    }

    .brand-tag {
      margin: 0.35rem 0 0;
      font-size: clamp(0.75rem, 2vmin, 0.95rem);
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--muted);
      text-transform: uppercase;
    }

    @keyframes brand-pulse {
      0%,
      100% {
        text-shadow: 0 0 18px rgba(0, 170, 255, 0.35);
      }
      50% {
        text-shadow: 0 0 32px rgba(0, 170, 255, 0.75);
      }
    }

    .ring {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .ring .segment,
    .ring .back-btn {
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .ring .segment {
      fill: url(#segment-fill);
      stroke: url(#segment-stroke);
      stroke-width: 1.2;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.35s ease, filter 0.25s ease;
      filter: url(#soft-glow);
    }

    .ring .segment:hover,
    .ring .segment:focus-visible,
    .ring .segment.is-active {
      fill: url(#segment-fill-hot);
      stroke: #7ad8ff;
      stroke-width: 1.8;
      filter: url(#hot-glow);
    }

    .hub-inner.is-docked .ring .segment:not(.is-active) {
      pointer-events: none;
      opacity: 0.35;
    }

    .ring .back-btn {
      fill: url(#back-fill);
      stroke: rgba(150, 230, 255, 0.85);
      stroke-width: 1.4;
      cursor: pointer;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease 0.15s, filter 0.25s ease;
      filter: url(#soft-glow);
    }

    .hub-inner.is-docked .ring .back-btn {
      pointer-events: auto;
      opacity: 1;
    }

    .ring .back-btn:focus,
    .ring .back-btn:focus-visible,
    .ring .segment:focus,
    .ring .segment:focus-visible {
      outline: none;
    }

    .ring .back-btn:hover,
    .ring .back-btn:focus-visible {
      fill: url(#back-fill-hot);
      stroke: #fff;
      filter: url(#hot-glow);
    }

    .ring .back-label {
      fill: #e8f7ff;
      font-family: "Orbitron", sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
      filter: url(#text-glow);
    }

    .hub-inner.is-docked .ring .back-label {
      opacity: 1;
    }

    .ring .deco {
      pointer-events: none;
    }

    .ring .halo-ring {
      fill: none;
      stroke: rgba(0, 170, 255, 0.22);
      stroke-width: 0.6;
    }

    .ring .halo-ring.dashed {
      stroke: rgba(0, 190, 255, 0.45);
      stroke-width: 0.8;
      stroke-dasharray: 3 7;
      transform-box: view-box;
      transform-origin: 100px 100px;
      animation: scan-spin 18s linear infinite;
    }

    .ring .halo-ring.dashed-rev {
      stroke: rgba(120, 210, 255, 0.28);
      stroke-width: 0.5;
      stroke-dasharray: 1 11;
      transform-box: view-box;
      transform-origin: 100px 100px;
      animation: scan-spin 28s linear infinite reverse;
    }

    @keyframes scan-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .ring .energy-core {
      fill: url(#core-fill);
      stroke: rgba(120, 220, 255, 0.55);
      stroke-width: 0.8;
    }

    .ring .tick {
      stroke: rgba(0, 200, 255, 0.55);
      stroke-width: 0.7;
      stroke-linecap: round;
    }

    .ring .tick.major {
      stroke: rgba(140, 230, 255, 0.85);
      stroke-width: 1.1;
    }

    .ring .node {
      fill: #9ae6ff;
      filter: url(#node-glow);
    }

    .ring .ring-outline {
      fill: none;
      stroke: rgba(0, 180, 255, 0.55);
      stroke-width: 1.2;
      filter: url(#soft-glow);
    }

    .ring .ring-outline.inner {
      stroke: rgba(160, 230, 255, 0.75);
      stroke-width: 1.4;
    }

    .ring .ring-outline.outer-glow {
      stroke: rgba(0, 170, 255, 0.2);
      stroke-width: 3.5;
      filter: none;
    }

    .ring .label {
      fill: #e8f7ff;
      font-family: "Orbitron", sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      user-select: none;
      filter: url(#text-glow);
      transition: opacity 0.3s ease;
    }

    .hub-inner.is-docked .ring .label.is-dimmed {
      opacity: 0.25;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      z-index: 1;
      transform: translateX(-50%);
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(180, 220, 245, 0.45);
      pointer-events: none;
      animation: hint-fade 1.2s ease 0.6s both;
      transition: opacity 0.35s ease;
    }

    body.is-open .hint {
      opacity: 0;
    }

    @keyframes hint-fade {
      from {
        opacity: 0;
        transform: translate(-50%, 8px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @media (max-width: 640px) {
      :root {
        --ring-size: min(68vmin, 300px);
      }

      .ring .label {
        font-size: 9px;
      }

      .brand-name {
        letter-spacing: 0.18em;
        text-indent: 0.18em;
      }

      .hint {
        font-size: 0.7rem;
        letter-spacing: 0.12em;
      }

      .stage.dock-bl,
      .stage.dock-tl {
        padding-left: calc(var(--ring-size) * 0.36);
      }

      .stage.dock-tr,
      .stage.dock-br {
        padding-right: calc(var(--ring-size) * 0.36);
      }
    }
  </style>
</head>
<body>
  <canvas id="rain-canvas" aria-hidden="true"></canvas>

  <section class="stage" id="stage" aria-hidden="true">
    <article class="stage-card">
      <p class="stage-kicker" id="stage-kicker">分区</p>
      <h2 class="stage-title" id="stage-title">标题</h2>
      <div class="stage-body" id="stage-body"></div>
    </article>
  </section>

  <div class="hub-inner" id="hub">
    <div class="brand">
      <div>
        <h1 class="brand-name">MATRIX</h1>
        <p class="brand-tag">Personal Hub</p>
      </div>
    </div>
    <svg class="ring" id="ring" viewBox="0 0 200 200" role="navigation" aria-label="四区导航"></svg>
  </div>

  <p class="hint">点击圆环扇区打开子界面</p>

  <script>
    /* ========== 占位分区数据：后续只需改这里 ========== */
    const SECTIONS = [
      {
        id: "about",
        label: "关于",
        kicker: "分区一",
        title: "关于我",
        body: [
          "此处为占位文案。介绍你是谁、正在做什么，以及这个站点想传达的核心印象。",
          "后续可替换为真实简介、头像说明或一句话定位。"
        ]
      },
      {
        id: "skills",
        label: "技能",
        kicker: "分区二",
        title: "技能栈",
        body: [
          "此处列出你擅长的技术、工具或方法论。可用清单或短段落呈现。",
          "示例：前端、交互、视觉、自动化等——按你的真实能力改写。"
        ]
      },
      {
        id: "projects",
        label: "项目",
        kicker: "分区三",
        title: "项目经历",
        body: [
          "在这里概述代表性项目：背景、职责、成果与链接。",
          "当前为占位内容，便于你直接替换为项目条目。"
        ]
      },
      {
        id: "contact",
        label: "联系",
        kicker: "分区四",
        title: "联系我",
        body: [
          "留下邮箱、社交媒体或合作说明的占位文案。",
          "示例：hello@example.com — 请替换为你的真实联系方式。"
        ]
      }
    ];

    // 点击扇区 → 圆环移向对角角落（露出该扇区）
    const DOCK_BY_INDEX = ["dock-bl", "dock-tl", "dock-tr", "dock-br"];

    /* ========== 代码雨底层 ========== */
    const canvas = document.getElementById("rain-canvas");
    const ctx = canvas.getContext("2d");
    const columnWidth = 13;
    let width = 0;
    let height = 0;
    let columns = [];
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".split("");

    function resizeRain() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const count = Math.ceil(width / columnWidth);
      const prev = columns;
      columns = Array(count)
        .fill(0)
        .map((_, i) => (prev[i] != null ? prev[i] : 0));
    }

    function rain() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#0af";
      ctx.font = `${columnWidth}px monospace`;

      columns.forEach((value, index) => {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, index * columnWidth, value + columnWidth);
        columns[index] =
          value >= height || value > 8888 * Math.random()
            ? 0
            : value + columnWidth;
      });
    }

    resizeRain();
    window.addEventListener("resize", resizeRain);
    setInterval(rain, 45);

    // 入场动画只播一次，之后交给 dock 过渡
    const hubEl = document.getElementById("hub");
    hubEl.addEventListener(
      "animationend",
      () => hubEl.classList.add("is-ready"),
      { once: true }
    );

    /* ========== SVG 四段圆环 ========== */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const hub = document.getElementById("hub");
    const ring = document.getElementById("ring");
    const CX = 100;
    const CY = 100;
    const OUTER = 92;
    const INNER = 58;
    const SEGMENTS = 4;
    const STEP = 360 / SEGMENTS;

    function svgEl(name, attrs = {}) {
      const el = document.createElementNS(SVG_NS, name);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function polar(cx, cy, r, angleDeg) {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return {
        x: cx + r * Math.cos(rad),
        y: cy + r * Math.sin(rad)
      };
    }

    function annularSectorPath(startAngle, endAngle, outerR = OUTER, innerR = INNER) {
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;
      const p1 = polar(CX, CY, outerR, startAngle);
      const p2 = polar(CX, CY, outerR, endAngle);
      const p3 = polar(CX, CY, innerR, endAngle);
      const p4 = polar(CX, CY, innerR, startAngle);

      return [
        `M ${p1.x} ${p1.y}`,
        `A ${outerR} ${outerR} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        `L ${p3.x} ${p3.y}`,
        `A ${innerR} ${innerR} 0 ${largeArc} 0 ${p4.x} ${p4.y}`,
        "Z"
      ].join(" ");
    }

    /** 圆心扇形（返回按钮区域） */
    function pieSectorPath(startAngle, endAngle, r = INNER - 1) {
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;
      const p1 = polar(CX, CY, r, startAngle);
      const p2 = polar(CX, CY, r, endAngle);
      return [
        `M ${CX} ${CY}`,
        `L ${p1.x} ${p1.y}`,
        `A ${r} ${r} 0 ${largeArc} 1 ${p2.x} ${p2.y}`,
        "Z"
      ].join(" ");
    }

    const defs = svgEl("defs");
    const innerStop = (INNER / OUTER).toFixed(3);
    const midStop = ((INNER + (OUTER - INNER) * 0.35) / OUTER).toFixed(3);
    const midHotStop = ((INNER + (OUTER - INNER) * 0.4) / OUTER).toFixed(3);
    defs.innerHTML = `
      <radialGradient id="segment-fill" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${OUTER}">
        <stop offset="${innerStop}" stop-color="#34c0ff" stop-opacity="0.55"/>
        <stop offset="${midStop}" stop-color="#0a7ec8" stop-opacity="0.28"/>
        <stop offset="0.92" stop-color="#045a96" stop-opacity="0.08"/>
        <stop offset="1" stop-color="#023a60" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="segment-fill-hot" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${OUTER}">
        <stop offset="${innerStop}" stop-color="#9ae8ff" stop-opacity="0.75"/>
        <stop offset="${midHotStop}" stop-color="#20b0ff" stop-opacity="0.4"/>
        <stop offset="0.94" stop-color="#0680c8" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#024870" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="segment-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8adfff" stop-opacity="0.95"/>
        <stop offset="50%" stop-color="#0af" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#4cc8ff" stop-opacity="0.9"/>
      </linearGradient>
      <radialGradient id="core-fill" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#b8f0ff" stop-opacity="0"/>
        <stop offset="70%" stop-color="#0af" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#0af" stop-opacity="0.14"/>
      </radialGradient>
      <radialGradient id="back-fill" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${INNER}">
        <stop offset="0%" stop-color="#7adfff" stop-opacity="0.55"/>
        <stop offset="70%" stop-color="#0a8fd0" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#046090" stop-opacity="0.12"/>
      </radialGradient>
      <radialGradient id="back-fill-hot" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${INNER}">
        <stop offset="0%" stop-color="#dff7ff" stop-opacity="0.75"/>
        <stop offset="65%" stop-color="#2ab4ff" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#0678b8" stop-opacity="0.2"/>
      </radialGradient>
      <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="1.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="hot-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
        <feGaussianBlur stdDeviation="1.6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="0.8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    `;
    ring.appendChild(defs);

    const deco = svgEl("g", { class: "deco", "aria-hidden": "true" });
    deco.appendChild(svgEl("circle", { class: "halo-ring", cx: CX, cy: CY, r: 98 }));
    deco.appendChild(svgEl("circle", { class: "halo-ring dashed", cx: CX, cy: CY, r: 96.5 }));
    deco.appendChild(svgEl("circle", { class: "halo-ring dashed-rev", cx: CX, cy: CY, r: 54 }));
    deco.appendChild(svgEl("circle", { class: "energy-core", cx: CX, cy: CY, r: 52 }));

    for (let angle = 0; angle < 360; angle += 5) {
      const major = angle % 90 === 0;
      const mid = angle % 30 === 0;
      const outerR = major ? 99.5 : mid ? 98.2 : 97.2;
      const innerR = major ? 93.5 : mid ? 94.8 : 95.6;
      const a = polar(CX, CY, outerR, angle);
      const b = polar(CX, CY, innerR, angle);
      deco.appendChild(
        svgEl("line", {
          class: major ? "tick major" : "tick",
          x1: a.x.toFixed(2),
          y1: a.y.toFixed(2),
          x2: b.x.toFixed(2),
          y2: b.y.toFixed(2)
        })
      );
    }

    for (let i = 0; i < SEGMENTS; i++) {
      const angle = i * STEP;
      const a = polar(CX, CY, INNER + 1.5, angle);
      const b = polar(CX, CY, INNER + 5.5, angle);
      deco.appendChild(
        svgEl("line", {
          class: "tick major",
          x1: a.x.toFixed(2),
          y1: a.y.toFixed(2),
          x2: b.x.toFixed(2),
          y2: b.y.toFixed(2)
        })
      );
      const node = polar(CX, CY, OUTER + 1.2, angle);
      deco.appendChild(
        svgEl("circle", {
          class: "node",
          cx: node.x.toFixed(2),
          cy: node.y.toFixed(2),
          r: 1.6
        })
      );
    }

    ring.appendChild(deco);

    const segmentEls = [];
    const labelEls = [];
    const labelGroup = svgEl("g", { class: "deco" });

    SECTIONS.forEach((section, index) => {
      const start = index * STEP;
      const end = start + STEP;
      const mid = start + STEP / 2;

      const path = svgEl("path", {
        d: annularSectorPath(start, end),
        class: "segment",
        tabindex: "0",
        role: "button",
        "aria-label": `打开${section.title}`
      });
      path.dataset.index = String(index);
      ring.appendChild(path);
      segmentEls.push(path);

      const labelR = (OUTER + INNER) / 2 + 1;
      const pos = polar(CX, CY, labelR, mid);
      const text = svgEl("text", {
        class: "label",
        x: pos.x.toFixed(2),
        y: pos.y.toFixed(2)
      });
      text.textContent = section.label;
      labelGroup.appendChild(text);
      labelEls.push(text);
    });

    ring.appendChild(
      svgEl("circle", { class: "ring-outline outer-glow", cx: CX, cy: CY, r: OUTER })
    );
    ring.appendChild(
      svgEl("circle", { class: "ring-outline", cx: CX, cy: CY, r: OUTER })
    );
    ring.appendChild(
      svgEl("circle", { class: "ring-outline inner", cx: CX, cy: CY, r: INNER })
    );
    ring.appendChild(labelGroup);

    // 返回扇形（内侧四分之一圆）
    const backBtn = svgEl("path", {
      class: "back-btn",
      tabindex: "-1",
      role: "button",
      "aria-label": "返回主界面"
    });
    const backLabel = svgEl("text", { class: "back-label" });
    backLabel.textContent = "返回";
    ring.appendChild(backBtn);
    ring.appendChild(backLabel);

    function setBackSector(index) {
      const start = index * STEP;
      const end = start + STEP;
      const mid = start + STEP / 2;
      backBtn.setAttribute("d", pieSectorPath(start, end, INNER - 0.5));
      const pos = polar(CX, CY, INNER * 0.48, mid);
      backLabel.setAttribute("x", pos.x.toFixed(2));
      backLabel.setAttribute("y", pos.y.toFixed(2));
    }

    /* ========== 对角收起 + 内容显现 ========== */
    const stage = document.getElementById("stage");
    const stageKicker = document.getElementById("stage-kicker");
    const stageTitle = document.getElementById("stage-title");
    const stageBody = document.getElementById("stage-body");
    let activeIndex = -1;
    let isOpen = false;

    function openSection(index) {
      const section = SECTIONS[index];
      const dock = DOCK_BY_INDEX[index];
      if (!section || !dock || isOpen) return;

      isOpen = true;
      activeIndex = index;
      document.body.classList.add("is-open");

      stageKicker.textContent = section.kicker;
      stageTitle.textContent = section.title;
      stageBody.innerHTML = section.body.map((p) => `<p>${p}</p>`).join("");

      setBackSector(index);
      backBtn.setAttribute("tabindex", "0");

      segmentEls.forEach((el, i) => {
        el.classList.toggle("is-active", i === index);
        el.setAttribute("tabindex", i === index ? "-1" : "-1");
      });
      labelEls.forEach((el, i) => {
        el.classList.toggle("is-dimmed", i !== index);
      });

      // 先重置 stage 的 dock class，再同步开启
      stage.classList.remove("dock-bl", "dock-tl", "dock-tr", "dock-br");
      stage.classList.add(dock);
      hub.classList.add("is-docked", dock);

      requestAnimationFrame(() => {
        stage.classList.add("is-open");
        stage.setAttribute("aria-hidden", "false");
      });
    }

    function closeSection() {
      if (!isOpen) return;

      const dock = DOCK_BY_INDEX[activeIndex];
      isOpen = false;
      activeIndex = -1;
      document.body.classList.remove("is-open");

      stage.classList.remove("is-open");
      stage.setAttribute("aria-hidden", "true");
      hub.classList.remove("is-docked", "dock-bl", "dock-tl", "dock-tr", "dock-br");
      backBtn.setAttribute("tabindex", "-1");

      segmentEls.forEach((el) => {
        el.classList.remove("is-active");
        el.setAttribute("tabindex", "0");
      });
      labelEls.forEach((el) => el.classList.remove("is-dimmed"));

      const cleanup = (event) => {
        if (event.target !== hub || event.propertyName !== "left") return;
        hub.removeEventListener("transitionend", cleanup);
        if (!isOpen) {
          stage.classList.remove("dock-bl", "dock-tl", "dock-tr", "dock-br");
        }
      };
      hub.addEventListener("transitionend", cleanup);

      // 避免 dock class 残留影响下次 padding 动画
      if (dock) {
        // keep stage dock class briefly so padding animates out with content
        setTimeout(() => {
          if (!isOpen) stage.classList.remove(dock);
        }, 500);
      }
    }

    segmentEls.forEach((el) => {
      el.addEventListener("click", () => openSection(Number(el.dataset.index)));
      el.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openSection(Number(el.dataset.index));
        }
      });
    });

    // 阻止鼠标点击时获得焦点，避免系统默认白框
    backBtn.addEventListener("mousedown", (event) => event.preventDefault());
    backBtn.addEventListener("click", closeSection);
    backBtn.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        closeSection();
      }
    });

    segmentEls.forEach((el) => {
      el.addEventListener("mousedown", (event) => event.preventDefault());
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && isOpen) closeSection();
    });
  </script>
</body>
</html>
